
stages:
  - install
  - lint
  - test
  - e2e


# Cache do node_modules para evitar baixar tudo a cada job
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - node_modules/
    - .yarn


variables:
  NODE_ENV: "test"


# ── Estágio 1: instalar dependências ──────────────────
instalar_dependencias:
  stage: install
  image: node:20
  script:
    - yarn install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour


# ── Estágio 2: lint e formatação ──────────────────────
verificar_lint:
  stage: lint
  image: node:20
  needs: [instalar_dependencias]
  script:
    - yarn lint


# ── Estágio 3: testes unitários com Jest ──────────────
testes_unitarios:
  stage: test
  image: node:20
  needs: [instalar_dependencias]
  script:
    - yarn test
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    paths:
      - reports/coverage/
    expire_in: 7 days


# ── Estágio 4: testes E2E com Playwright ─────────────
testes_e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.47.0-noble
  needs: [testes_unitarios]
  script:
    - yarn install --frozen-lockfile
    - yarn e2e
  artifacts:
    when: on_failure
    paths:
      - test-results/
    expire_in: 3 days
  only:
    - master
    - merge_requests

